name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        type: choice
        default: debug
        options:
          - debug
          - standalone
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g"
    steps:
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h /

      - uses: actions/checkout@v4

      - name: Подтянуть submodules (их нет в zip с GitHub)
        run: |
          set -e
          VCODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          git clone --depth 1 https://github.com/TelegramMessenger/Telegram-Android.git /tmp/tgofficial
          cd /tmp/tgofficial
          TAG=$(git ls-remote --tags origin "*${VCODE}*" | awk '{print $2}' | sed 's#refs/tags/##; s#\^{}##' | sort -u | head -n1 || true)
          if [ -n "$TAG" ]; then
            echo "Используем тег $TAG"
            git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" && git checkout "$TAG"
          else
            echo "Тег для $VCODE не найден, используем master"
          fi
          git submodule update --init --recursive --depth 1 --jobs 8 || git submodule update --init --recursive --jobs 8
          cd "$GITHUB_WORKSPACE"
          for d in $(grep 'path = ' /tmp/tgofficial/.gitmodules | sed 's/.*= //'); do
            mkdir -p "$d"
            rsync -a --exclude='.git' "/tmp/tgofficial/$d/" "$d/"
            echo "$d: $(ls -A "$d" | wc -l) файлов"
          done
          test -f TMessagesProj_Modules/media/core_settings.gradle
          rm -rf /tmp/tgofficial

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить SDK, build-tools и NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Сборка APK
        run: |
          TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$TYPE" = "standalone" ]; then
            gradle :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace
          else
            gradle :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace
          fi

      - name: Найти APK
        run: find TMessagesProj_AppStandalone/build/outputs -name "*.apk" -print

      - uses: actions/upload-artifact@v4
        with:
          name: gleam-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
