name: Build Telegrix APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Clone Telegram sources with submodules
        run: git clone --recursive --shallow-submodules --depth 1 https://github.com/DrKLO/Telegram.git tg
      - name: Apply Telegrix design
        run: |
          pip install pillow numpy
          python3 tools/restyle.py tg tools/fonts/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build APK
        working-directory: tg
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: telegrix-apk
          path: tg/TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          
