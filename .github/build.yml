name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle task"
        default: "assembleAfatRelease"
        type: choice
        options:
          - assembleAfatRelease
          - assembleAfatDebug
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK / NDK / CMake (SDK is preinstalled on the runner)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          [ -x "$SDKM" ] || SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          # find the project root (folder that contains TMessagesProj_App), even if it is in a subfolder
          ROOT=$(dirname "$(find . -type d -name TMessagesProj_App -not -path '*/node_modules/*' | head -n1)")
          [ -n "$ROOT" ] && [ -d "$ROOT/TMessagesProj_App" ] || { echo "TMessagesProj_App not found in repo"; ls -la; exit 1; }
          echo "Project root: $ROOT"
          cd "$ROOT"
          TASK="${{ github.event.inputs.variant || 'assembleAfatRelease' }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :TMessagesProj_App:$TASK --no-daemon --stacktrace
          else
            echo "gradlew missing -> installing Gradle 8.13"
            curl -sL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.13/bin/gradle :TMessagesProj_App:$TASK --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-apk
          path: '**/TMessagesProj_App/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          
